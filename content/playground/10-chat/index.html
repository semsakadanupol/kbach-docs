<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Chat: bubbles on both sides, the list folds away on a phone</title>
  </head>
  <body class="bg-surface text-ink antialiased">
    <!-- the list and the chat side by side from md; on a phone, one at a time -->
    <div id="app" class="-m-6 flex h-screen overflow-hidden bg-card">
      <aside id="list" class="hidden w-full shrink-0 flex-col border-r border-line md:flex md:w-80">
        <div class="flex h-16 shrink-0 items-center justify-between px-5">
          <h1 class="text-lg font-bold">Messages</h1>
          <button
            aria-label="New message"
            class="grid size-9 place-items-center rounded-lg text-muted transition hover:bg-well hover:text-ink"
          >
            <svg
              viewBox="0 0 24 24"
              class="size-5 fill-none stroke-current stroke-2"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <path d="M12 20h9M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4z" />
            </svg>
          </button>
        </div>
        <div class="px-4 pb-3">
          <label class="relative block">
            <svg
              viewBox="0 0 24 24"
              class="pointer-events-none absolute top-2.5 left-3 size-4 fill-none stroke-muted stroke-2"
              stroke-linecap="round"
            >
              <circle cx="11" cy="11" r="7" />
              <path d="m21 21-4.3-4.3" />
            </svg>
            <input
              placeholder="Search"
              aria-label="Search"
              class="h-9 w-full rounded-lg bg-well pr-3 pl-9 text-sm outline-none transition focus:ring-2 focus:ring-brand/40"
            />
          </label>
        </div>
        <!-- each conversation: avatar (a green dot when they're online), name, last line, time, unread count -->
        <ul class="flex-1 space-y-0.5 overflow-y-auto px-2 pb-2">
          <li>
            <button
              data-open
              class="flex w-full items-center gap-3 rounded-xl bg-brand/10 p-3 text-left"
            >
              <span class="relative shrink-0"
                ><span
                  class="grid size-11 place-items-center rounded-full bg-linear-to-br from-violet-5 to-fuchsia-6 text-sm font-bold text-white"
                  >SC</span
                ><span
                  class="absolute right-0 bottom-0 size-3 rounded-full bg-emerald-5 ring-2 ring-card"
                ></span
              ></span>
              <span class="min-w-0 flex-1"
                ><span class="flex items-baseline justify-between gap-2"
                  ><b class="truncate text-sm font-semibold">Srey Chan</b
                  ><span class="shrink-0 text-xs text-accent">now</span></span
                ><span class="block truncate text-sm text-muted">Typing…</span></span
              >
            </button>
          </li>
          <li>
            <button
              data-open
              class="flex w-full items-center gap-3 rounded-xl p-3 text-left transition hover:bg-well"
            >
              <span class="relative shrink-0"
                ><span
                  class="grid size-11 place-items-center rounded-full bg-linear-to-br from-sky-5 to-blue-6 text-sm font-bold text-white"
                  >DT</span
                ><span
                  class="absolute right-0 bottom-0 size-3 rounded-full bg-emerald-5 ring-2 ring-card"
                ></span
              ></span>
              <span class="min-w-0 flex-1"
                ><span class="flex items-baseline justify-between gap-2"
                  ><b class="truncate text-sm font-semibold">Design team</b
                  ><span class="shrink-0 text-xs text-muted">9:41</span></span
                ><span class="flex items-center gap-2"
                  ><span class="min-w-0 flex-1 truncate text-sm text-muted"
                    >Bora: the new icons are in the shared folder, take a look when you can</span
                  ><span
                    class="grid h-5 min-w-5 shrink-0 place-items-center rounded-full bg-brand px-1.5 text-[11px] font-semibold text-white"
                    >3</span
                  ></span
                ></span
              >
            </button>
          </li>
          <li>
            <button
              data-open
              class="flex w-full items-center gap-3 rounded-xl p-3 text-left transition hover:bg-well"
            >
              <span
                class="grid size-11 shrink-0 place-items-center rounded-full bg-linear-to-br from-amber-5 to-orange-6 text-sm font-bold text-white"
                >VK</span
              >
              <span class="min-w-0 flex-1"
                ><span class="flex items-baseline justify-between gap-2"
                  ><b class="truncate text-sm font-semibold">Visal Keo</b
                  ><span class="shrink-0 text-xs text-muted">Tue</span></span
                ><span class="block truncate text-sm text-muted"
                  >Thanks! See you then 👋</span
                ></span
              >
            </button>
          </li>
          <li>
            <button
              data-open
              class="flex w-full items-center gap-3 rounded-xl p-3 text-left transition hover:bg-well"
            >
              <span
                class="grid size-11 shrink-0 place-items-center rounded-full bg-linear-to-br from-emerald-5 to-teal-6 text-sm font-bold text-white"
                >MO</span
              >
              <span class="min-w-0 flex-1"
                ><span class="flex items-baseline justify-between gap-2"
                  ><b class="truncate text-sm font-semibold">Mony Ouk-Fairbanks-Delacroix</b
                  ><span class="shrink-0 text-xs text-muted">Mon</span></span
                ><span class="block truncate text-sm text-muted"
                  >The invoice is attached</span
                ></span
              >
            </button>
          </li>
        </ul>
      </aside>

      <section id="chat" class="flex min-w-0 flex-1 flex-col md:flex">
        <header class="flex h-16 shrink-0 items-center gap-3 border-b border-line px-3 sm:px-5">
          <button
            id="back"
            aria-label="Back to messages"
            class="grid size-9 place-items-center rounded-lg text-muted transition hover:bg-well hover:text-ink md:hidden"
          >
            <svg
              viewBox="0 0 24 24"
              class="size-5 fill-none stroke-current stroke-2"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <path d="M15 18l-6-6 6-6" />
            </svg>
          </button>
          <span class="relative shrink-0"
            ><span
              class="grid size-10 place-items-center rounded-full bg-linear-to-br from-violet-5 to-fuchsia-6 text-sm font-bold text-white"
              >SC</span
            ><span
              class="absolute right-0 bottom-0 size-3 rounded-full bg-emerald-5 ring-2 ring-card"
            ></span
          ></span>
          <span class="min-w-0 flex-1"
            ><b class="block truncate font-semibold">Srey Chan</b
            ><span class="block truncate text-xs text-emerald-7 dark:text-emerald-4"
              >Online</span
            ></span
          >
          <button
            aria-label="Call"
            class="grid size-9 place-items-center rounded-lg text-muted transition hover:bg-well hover:text-ink"
          >
            <svg
              viewBox="0 0 24 24"
              class="size-5 fill-none stroke-current stroke-2"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <path
                d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.13.96.36 1.9.7 2.81a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.91.34 1.85.57 2.81.7A2 2 0 0 1 22 16.92z"
              />
            </svg>
          </button>
          <button
            aria-label="Video call"
            class="hidden size-9 place-items-center rounded-lg text-muted transition hover:bg-well hover:text-ink sm:grid"
          >
            <svg
              viewBox="0 0 24 24"
              class="size-5 fill-none stroke-current stroke-2"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <path d="m23 7-7 5 7 5V7z" />
              <rect x="1" y="5" width="15" height="14" rx="2" />
            </svg>
          </button>
        </header>

        <!-- the messages: theirs on the left, yours on the right in the brand color -->
        <ol id="messages" class="flex flex-1 flex-col gap-1 overflow-y-auto px-3 py-5 sm:px-5"></ol>

        <form id="composer" class="flex shrink-0 items-end gap-2 border-t border-line p-3 sm:px-5">
          <button
            type="button"
            aria-label="Attach a file"
            class="grid size-10 shrink-0 place-items-center rounded-full text-muted transition hover:bg-well hover:text-ink"
          >
            <svg
              viewBox="0 0 24 24"
              class="size-5 fill-none stroke-current stroke-2"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <path
                d="m21.44 11.05-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"
              />
            </svg>
          </button>
          <input
            id="text"
            autocomplete="off"
            placeholder="Write a message"
            aria-label="Message"
            class="h-10 min-w-0 flex-1 rounded-full bg-well px-4 text-sm outline-none transition focus:ring-2 focus:ring-brand/40"
          />
          <!-- send: faded and still until there's something to send -->
          <button
            id="send"
            aria-label="Send"
            disabled
            class="grid size-10 shrink-0 place-items-center rounded-full bg-brand text-white shadow-md shadow-brand/30 transition hover:bg-brand/90 active:scale-90 disabled:scale-90 disabled:opacity-40 disabled:shadow-none"
          >
            <svg
              viewBox="0 0 24 24"
              class="size-4 fill-none stroke-current stroke-2"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <path d="M22 2 11 13M22 2l-7 20-4-9-9-4 20-7z" />
            </svg>
          </button>
        </form>
      </section>
    </div>
  </body>
</html>
